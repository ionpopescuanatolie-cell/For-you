<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Chat — День 5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e1621;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            background-color: #17212b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Шапка чата */
        .chat-header {
            background-color: #17212b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0e1621;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-status {
            font-size: 13px;
            color: #7f91a4;
            transition: color 0.3s ease;
        }

        .chat-status.typing {
            color: #64b5ef;
            font-weight: 500;
        }

        /* Окно сообщений */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: flex-start;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(#232e3c 1px, transparent 0);
            background-size: 16px 16px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background-color: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background-color: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            float: right;
            margin-left: 8px;
            margin-top: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #7f91a4;
        }

        .message.outgoing .message-time {
            color: #b0c4de;
        }

        /* Галочки прочтения */
        .ticks {
            font-size: 11px;
            color: #7f91a4;
        }

        .ticks.read {
            color: #64b5ef;
        }

        /* Фото-спойлер */
        .spoiler-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            max-width: 260px;
        }

        .spoiler-img {
            width: 100%;
            height: auto;
            display: block;
            filter: blur(20px);
            transition: filter 0.5s ease;
            transform: scale(1.05);
        }

        .spoiler-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 8px;
            gap: 6px;
            transition: opacity 0.4s ease;
        }

        .spoiler-container.revealed .spoiler-img {
            filter: blur(0);
            transform: scale(1);
        }

        .spoiler-container.revealed .spoiler-overlay {
            opacity: 0;
            pointer-events: none;
        }

        /* Панель быстрых ответов */
        .chat-input-panel {
            padding: 12px;
            background-color: #17212b;
            border-top: 1px solid #0e1621;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reply-btn {
            background-color: #242f3d;
            color: #64b5ef;
            border: 1px solid #2b5278;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }

        .reply-btn:hover {
            background-color: #2b5278;
            color: #ffffff;
        }

        .reply-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Шапка -->
        <div class="chat-header">
            <img src="https://via.placeholder.com/100" alt="Avatar" class="avatar" id="chat-avatar">
            <div class="user-info">
                <span class="user-name">Любимая ❤️</span>
                <span class="chat-status" id="chat-status">в сети</span>
            </div>
        </div>

        <!-- Сообщения -->
        <div class="chat-messages" id="chat-messages">
            <!-- Приветственное сообщение -->
            <div class="message incoming">
                Привет! Я так ждала 5-й день... Скрывала от тебя кое-что под спойлером 🙈
                <div class="message-meta">
                    <span class="message-time">12:00</span>
                </div>
            </div>

            <!-- Фото-спойлер -->
            <div class="message incoming">
                <div class="spoiler-container" onclick="revealSpoiler(this)">
                    <img src="https://via.placeholder.com/300x200" alt="Secret Photo" class="spoiler-img">
                    <div class="spoiler-overlay">
                        <span>🔒 Нажми, чтобы открыть секретный кадр</span>
                    </div>
                </div>
                Посмотри скорее!
                <div class="message-meta">
                    <span class="message-time">12:01</span>
                </div>
            </div>
        </div>

        <!-- Интерактивные варианты ответов -->
        <div class="chat-input-panel">
            <div class="quick-replies" id="quick-replies">
                <button class="reply-btn" onclick="sendUserReply('Вау, это потрясающе! ❤️')">Вау, это потрясающе! ❤️</button>
                <button class="reply-btn" onclick="sendUserReply('Жду не дождусь нашей встречи! 🥺')">Жду нашей встречи! 🥺</button>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('chat-status');
        const messagesEl = document.getElementById('chat-messages');
        const repliesEl = document.getElementById('quick-replies');

        // Функция открытия фото-спойлера
        function revealSpoiler(element) {
            element.classList.add('revealed');
        }

        // Функция получения текущего времени HH:MM
        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        // Отправка ответа пользователем
        function sendUserReply(text) {
            // Отключаем кнопки после выбора
            repliesEl.innerHTML = '';

            // Добавляем исходящее сообщение
            const userMsgHtml = `
                <div class="message outgoing">
                    ${text}
                    <div class="message-meta">
                        <span class="message-time">${getCurrentTime()}</span>
                        <span class="ticks" id="last-tick">✓</span>
                    </div>
                </div>
            `;
            messagesEl.insertAdjacentHTML('beforeend', userMsgHtml);
            scrollToBottom();

            // Имитация ответа
            simulatePartnerResponse();
        }

        // Имитация ответа партнера с эффектом «печатает...»
        async function simulatePartnerResponse() {
            // 1. Смена галочки на «прочитано» через 1 секунду
            await sleep(1000);
            const tickEl = document.getElementById('last-tick');
            if (tickEl) {
                tickEl.innerText = '✓✓';
                tickEl.classList.add('read');
            }

            // 2. Статус «печатает...»
            await sleep(800);
            statusEl.innerText = 'печатает...';
            statusEl.classList.add('typing');

            // 3. Задержка имитации набора текста
            await sleep(2500);
            statusEl.innerText = 'в сети';
            statusEl.classList.remove('typing');

            // 4. Добавление входящего сообщения
            const partnerMsgHtml = `
                <div class="message incoming">
                    Я знала, что тебе понравится! Обнимаю тебя очень-очень крепко 🤗❤️
                    <div class="message-meta">
                        <span class="message-time">${getCurrentTime()}</span>
                    </div>
                </div>
            `;
            messagesEl.insertAdjacentHTML('beforeend', partnerMsgHtml);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
