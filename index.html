<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Miesięcy Wspomnień, 6 Dni do Niespodzianki</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #ec4899;
            --accent-hover: #db2777;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --locked-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 600px;
        }

        .badge {
            background-color: rgba(236, 72, 153, 0.15);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card.unlocked {
            cursor: pointer;
            border-color: rgba(236, 72, 153, 0.4);
        }

        .card.unlocked:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card.locked {
            opacity: 0.75;
            background-color: var(--locked-bg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-step {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .card-icon {
            font-size: 1.4rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .lock-timer {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 10px;
            border-radius: 6px;
            width: fit-content;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-title {
            color: var(--accent);
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-right: 25px;
        }

        .modal-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .modal-body h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .modal-body p {
            margin-bottom: 12px;
        }

        .modal-body img {
            width: 100%;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">Tajny Projekt</span>
        <h1>6 Miesięcy Wspomnień, 6 Dni do Niespodzianki</h1>
        <p class="subtitle">15 września – 20 września | Odliczanie krok po kroku</p>
    </header>

    <div class="grid" id="grid-container"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        const levels = [
            {
                id: 1,
                unlockDate: "2026-09-15",
                title: "Wszystko zaczęło się od gry",
                subtitle: "15 września — Dzień 1",
                shortDesc: "Jedna wiadomość z 15 marca, która zmieniła wszystko...",
                icon: "🎮",
                content: `
                    <h3>Nasze początki: 15 Marca</h3>
                    <p>Wszystko zaczęło się 15 marca od zwykłej gry w Palmon. Napisałem do Ciebie z propozycją fuzji naszych sojuszy, szczerze myśląc, że to tylko kolejny zwykły moment w grze.</p>
                    
                    <img src="Screenshot_20260426_173726_Palmon Survival.jpg" alt="Zrzut ekranu z gry Palmon">
                    
                    <p>Kto by pomyślał, że w jakiejś grze mobilnej poznam Ciebie — najważniejszą osobę w moim życiu... ❤️</p>
                `
            },
            {
                id: 2,
                unlockDate: "2026-09-16",
                title: "Dzień 2",
                subtitle: "16 września — Dzień 2",
                shortDesc: "Kolejne wspólne wspomnienie...",
                icon: "💬",
                content: `
                    <h3>Dzień 2</h3>
                    <p>Tutaj dodamy Twoje drugie wspomnienie lub historię.</p>
                `
            },
            {
                id: 3,
                unlockDate: "2026-09-17",
                title: "Dzień 3",
                subtitle: "17 września — Dzień 3",
                shortDesc: "Kolejny krok w naszej historii...",
                icon: "✨",
                content: `
                    <h3>Dzień 3</h3>
                    <p>Tutaj dodamy Twoje trzecie wspomnienie.</p>
                `
            },
            {
                id: 4,
                unlockDate: "2026-09-18",
                title: "Dzień 4",
                subtitle: "18 września — Dzień 4",
                shortDesc: "Wspólne chwile...",
                icon: "⭐",
                content: `
                    <h3>Dzień 4</h3>
                    <p>Tutaj dodamy Twoje czwarte wspomnienie.</p>
                `
            },
            {
                id: 5,
                unlockDate: "2026-09-19",
                title: "Dzień 5",
                subtitle: "19 września — Dzień 5",
                shortDesc: "Już prawie na miejscu...",
                icon: "🌟",
                content: `
                    <h3>Dzień 5</h3>
                    <p>Tutaj dodamy Twoje piąte wspomnienie.</p>
                `
            },
            {
                id: 6,
                unlockDate: "2026-09-20",
                title: "Finał",
                subtitle: "20 września — Dzień 6",
                shortDesc: "Główny prezent i niespodzianka!",
                icon: "🎁",
                content: `
                    <h3>Wszystkiego najlepszego!</h3>
                    <p>Finałowa wiadomość i niespodzianka dla Natalii.</p>
                `
            }
        ];

        function renderCards() {
            const container = document.getElementById('grid-container');
            const todayStr = new Date().toISOString().split('T')[0];

            container.innerHTML = '';

            levels.forEach(lvl => {
                // ТЕСТОВЫЙ РЕЖИМ: true открывает все карточки для проверки.
                // Перед отправкой замени true обратно на: todayStr >= lvl.unlockDate
                const isUnlocked = true;
                
                const card = document.createElement('div');
                card.className = `card ${isUnlocked ? 'unlocked' : 'locked'}`;

                if (lvl.id === 6 && isUnlocked) {
                    card.style.borderColor = 'var(--accent)';
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-step">POZIOM ${lvl.id}</span>
                        <span class="card-icon">${isUnlocked ? lvl.icon : '🔒'}</span>
                    </div>
                    <div class="card-title">${isUnlocked ? lvl.title : 'Zablokowane'}</div>
                    <div class="card-desc">${isUnlocked ? lvl.shortDesc : 'Odblokuje się ' + lvl.unlockDate}</div>
                    ${!isUnlocked ? `<div class="lock-timer">🔒 Dostępne od ${lvl.unlockDate}</div>` : ''}
                `;

                if (isUnlocked) {
                    card.onclick = () => openModal(lvl.id);
                }

                container.appendChild(card);
            });
        }

        function openModal(id) {
            const lvl = levels.find(l => l.id === id);
            if (!lvl) return;

            document.getElementById('modal-title').innerText = lvl.subtitle;
            document.getElementById('modal-body').innerHTML = lvl.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        renderCards();
    </script>
</body>
</html>
